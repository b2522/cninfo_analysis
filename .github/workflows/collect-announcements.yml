name: Collect announcements

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-announcements
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out default branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install .

      - name: Run collection
        env:
          PYTHONPATH: src
        run: |
          python -u - <<'PY'
          import asyncio
          from datetime import UTC, datetime

          from cninfo_miner.main import DEFAULT_DATABASE_PATH, manual_collection_range
          from cninfo_miner.repository import SQLiteRepository
          from cninfo_miner.worker import CollectionWorker


          async def run() -> None:
              repository = SQLiteRepository(DEFAULT_DATABASE_PATH)
              try:
                  repository.recover_interrupted_tasks()
                  start_date, end_date = manual_collection_range(datetime.now(UTC))
                  print(f"Collecting announcements from {start_date} to {end_date}.")
                  task = repository.create_task(start_date, end_date, task_type="collection")
                  await CollectionWorker(repository).run(task["id"], start_date, end_date)
                  saved = repository.get_task(task["id"])
                  if saved["status"] != "completed":
                      raise RuntimeError(saved.get("error") or "Announcement collection failed")
                  print(f"Collected {saved["processed"]} announcements.")
              finally:
                  repository.close()


          asyncio.run(run())
          PY

      - name: Commit SQLite updates
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/cninfo_announcement_mining.sqlite3
          if git diff --cached --quiet; then
            echo "SQLite database is unchanged."
            exit 0
          fi
          git commit -m "chore(data): update announcements"
          git push origin "HEAD:${DEFAULT_BRANCH}"
