<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>公告事件筛选</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="command-bar" aria-label="公告采集与分析">
      <div class="collection-tools">
        <div class="date-tools">
          <span class="date-label">抓取时间</span>
          <input id="startDate" type="date" aria-label="抓取开始日期">
          <span class="date-separator" aria-hidden="true">至</span>
          <input id="endDate" type="date" aria-label="抓取结束日期">
        </div>
        <div class="actions">
          <button id="collect" class="button secondary">抓取公告</button>
          <button id="analyze" class="button primary">分析公告</button>
        </div>
      </div>
      <button id="settings" class="text-button settings-button">模型设置</button>
    </section>

    <section id="taskCard" aria-live="polite" hidden></section>

    <section class="table-panel" aria-labelledby="tableTitle">
      <div class="table-head"><h2 id="tableTitle">公告列表</h2><span id="resultCount" class="result-count">0 条</span></div>
      <div class="table-wrap">
        <table>
          <colgroup>
            <col class="column-time">
            <col class="column-code">
            <col class="column-name">
            <col class="column-title">
            <col class="column-result">
          </colgroup>
          <thead>
            <tr>
              <th><label for="timeRange"><span>时间</span><select id="timeRange" aria-label="时间范围"><option value="all" selected>所有日期</option><option value="tomorrow">明天</option><option value="today">今天</option><option value="2">近 2 天</option><option value="3">近 3 天</option></select></label></th>
              <th>代码</th>
              <th>简称</th>
              <th>公告标题</th>
              <th class="result-column"><label for="resultFilter"><span>分析结果</span><select id="resultFilter" aria-label="分析结果筛选"><option value="all">当前队列</option><option value="collected">全部抓取（含已排除）</option><option value="opportunity">机会</option><option value="risk">风险</option></select></label></th>
            </tr>
          </thead>
          <tbody id="results" aria-live="polite"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="settingsDialog">
    <form method="dialog">
      <div class="dialog-head"><div><p class="eyebrow">MODEL CONNECTION</p><h2>OpenAI 兼容模型</h2></div><button class="text-button">关闭</button></div>
      <label>API Base URL<input id="baseUrl" autocomplete="off" placeholder="https://.../v1"></label>
      <label>API Key<input id="apiKey" type="password" autocomplete="current-password" placeholder="保存在本机数据库和此浏览器"></label>
      <label>模型名<input id="model" autocomplete="off" placeholder="model-name"></label>
      <div class="dialog-actions"><button id="clearSettings" type="button" class="text-button danger">清除本地设置</button><button id="saveSettings" type="button" class="button primary">保存设置</button></div>
    </form>
  </dialog>
  <script src="/assets/app.js"></script>
</body>
</html>
